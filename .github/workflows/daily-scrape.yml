name: Daily Real Estate Scraper

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 00:00 Curaçao (UTC-4)
  workflow_dispatch:        # Manual trigger from GitHub Actions UI
    inputs:
      sources:
        description: 'Comma-separated sources (leave empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (scrape but do not write to Supabase)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape:
    name: Scrape & Upload
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scraper/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scraper/requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install chromium --with-deps

      - name: Run scraper orchestrator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Facebook scraper requires headless=False + local cookies — runs via Windows Task Scheduler instead
          DEFAULT_SOURCES="remax,athome,caresto,livinggoed"
          SOURCES_ARG=""
          DRY_RUN_ARG=""
          if [ -n "${{ github.event.inputs.sources }}" ]; then
            SOURCES_ARG="--sources ${{ github.event.inputs.sources }}"
          else
            SOURCES_ARG="--sources $DEFAULT_SOURCES"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_ARG="--dry-run"
          fi
          python -m scraper.orchestrator $SOURCES_ARG $DRY_RUN_ARG

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ *KasKorsou scraper failed!*\nRun: ${{ github.run_id }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>"
            }
